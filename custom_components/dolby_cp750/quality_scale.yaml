# Status against the Home Assistant integration quality scale.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
#
# Custom integrations are not graded by Home Assistant; this file records how the
# integration aligns with the Bronze tier. Higher tiers are not claimed.
rules:
  # Bronze
  action-setup:
    status: done
    comment: The send_command action is registered in async_setup.
  appropriate-polling:
    status: done
    comment: >-
      Fader, mute and input are read every 5 seconds (configurable, 2-60 s) over one
      persistent TCP connection; settings that rarely change are read once a minute.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: No external requirements; the ASCII protocol and SNMP clients are part of the integration.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to events; they read coordinator data.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: done
    comment: >-
      Setup connects and checks the serial number; a different unit at the address
      fails setup. A unit that is switched off is normal in a projection booth, so
      the entry still loads, shows the unit as off and reconnects by itself.
  unique-config-entry: done
